		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#okaba-guide{position:fixed;inset:0;z-index:40;display:none;color:#F2E8D6;-webkit-text-size-adjust:100%;text-size-adjust:100%;
 font:700 16px/1.55 "OkabaGuide",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#okaba-guide.on{display:block}
#okaba-guide .og-back{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(16,13,12,.80) 0%,rgba(6,4,4,.92) 70%,rgba(2,1,1,.96) 100%)}
#okaba-guide .og-card{position:absolute;box-sizing:border-box;left:50%;transform:translateX(-50%);
 width:min(440px,calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)));
 max-height:calc(100% - 112px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
 padding:16px 18px 14px;border-radius:4px;background:#100d0c;
 background-image:radial-gradient(ellipse at 50% 0%,rgba(214,82,56,.10),transparent 60%),linear-gradient(180deg,#17110f,#0e0b0a);
 border:1px solid #5e5245;box-shadow:inset 0 0 0 3px #100d0c,inset 0 0 0 4px rgba(242,232,214,.28),0 10px 40px rgba(0,0,0,.7)}
/* 案内板の四すみの鋲 */
#okaba-guide .og-card::before,#okaba-guide .og-card::after{content:"";position:absolute;top:8px;width:5px;height:5px;border-radius:50%;background:#8a7a62;box-shadow:0 0 0 1px #100d0c}
#okaba-guide .og-card::before{left:8px}
#okaba-guide .og-card::after{right:8px}
#okaba-guide .og-in{animation:ogIn .18s ease-out both}
@keyframes ogIn{from{opacity:0}to{opacity:1}}
#okaba-guide .og-logo{display:block;height:34px;width:auto;margin:0 auto 2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
#okaba-guide .og-ttl{font-size:21px;line-height:1.35;text-align:center;letter-spacing:.04em;color:#F2E8D6}
#okaba-guide .og-ttl::after{content:"";display:block;width:64%;height:1px;margin:7px auto 0;background:linear-gradient(90deg,transparent,#D65238,transparent)}
#okaba-guide .og-lead{margin:7px 0 10px;text-align:center;color:#BDB3A3;font-size:15px}
#okaba-guide .og-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#okaba-guide .og-step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:3px;background:rgba(242,232,214,.05);border:1px solid rgba(242,232,214,.14)}
#okaba-guide .og-no{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:#D65238;color:#100d0c;font-size:19px;box-shadow:0 0 0 2px #100d0c,0 0 0 3px #D65238}
#okaba-guide .og-txt{font-size:18px;line-height:1.5;min-width:0}
#okaba-guide .og-txt small{display:block;font-size:13.5px;line-height:1.45;color:#BDB3A3;margin-top:2px}
#okaba-guide .og-txt b{color:#EDBF6B}
#okaba-guide .og-nw{white-space:nowrap}
#okaba-guide .og-ico{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:34px;height:34px;margin:0 3px;
 border-radius:8px;background:#F2E8D6;color:#0a6cff;box-shadow:0 1px 0 rgba(0,0,0,.6)}
#okaba-guide .og-ico svg{width:24px;height:24px}
#okaba-guide .og-chip{display:inline-flex;vertical-align:middle;align-items:center;gap:8px;margin:2px 2px;padding:5px 10px;border-radius:8px;
 background:#F2E8D6;color:#1b1714;font-size:16px;box-shadow:0 1px 0 rgba(0,0,0,.6);white-space:nowrap}
#okaba-guide .og-chip svg{width:20px;height:20px;color:#1b1714}
#okaba-guide .og-notes{margin:10px 2px 0;padding:0;list-style:none;color:#BDB3A3;font-size:13.5px;line-height:1.5}
#okaba-guide .og-notes li{position:relative;padding-left:14px}
#okaba-guide .og-notes li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;background:#D65238;transform:rotate(45deg)}
#okaba-guide .og-btns{display:flex;gap:10px;margin-top:12px}
#okaba-guide button{font:inherit;font-size:16px;min-height:46px;padding:8px 14px;border-radius:3px;cursor:pointer;touch-action:manipulation;
 color:#F2E8D6;background:#1e1714;border:1px solid #8a7a62;box-shadow:inset 0 0 0 2px #1e1714,inset 0 0 0 3px rgba(242,232,214,.18);
 transition:transform .07s ease-out}
#okaba-guide button:active{transform:scale(.94)}
#okaba-guide .og-later{flex:1}
#okaba-guide .og-never{flex:none;background:transparent;border-color:transparent;box-shadow:none;color:#BDB3A3;text-decoration:underline;text-underline-offset:3px}
#okaba-guide .og-main{display:block;width:100%;min-height:56px;font-size:19px;color:#F2E8D6;background:linear-gradient(180deg,#b8402a,#8e2a1a);border-color:#D65238;
 box-shadow:inset 0 0 0 2px #8e2a1a,inset 0 0 0 3px rgba(242,232,214,.35),0 4px 14px rgba(0,0,0,.5)}
#okaba-guide .og-main small{display:block;font-size:13px;color:#F2E8D6;opacity:.85}
#okaba-guide .og-copy{display:block;width:100%;margin-top:8px}
#okaba-guide .og-msg{margin-top:8px;text-align:center;color:#EDBF6B;font-size:15px;min-height:0}
/* 矢印（ゆっくり上下・点滅なし） */
#okaba-guide .og-arrow{position:absolute;width:64px;height:76px;margin-left:-32px;pointer-events:none;display:none}
#okaba-guide.ar-bottom .og-arrow,#okaba-guide.ar-top .og-arrow{display:block}
#okaba-guide.ar-bottom .og-arrow{bottom:calc(4px + env(safe-area-inset-bottom))}
#okaba-guide.ar-top .og-arrow{top:calc(2px + env(safe-area-inset-top));transform:rotate(180deg)}
#okaba-guide .og-arrow svg{width:64px;height:76px;display:block;filter:drop-shadow(0 0 10px rgba(237,191,107,.45)) drop-shadow(0 3px 4px rgba(0,0,0,.9));animation:ogBob 1.6s ease-in-out infinite alternate}
@keyframes ogBob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@media (prefers-reduced-motion: reduce){#okaba-guide .og-arrow svg{animation:none}}
#okaba-guide .og-alab{position:absolute;white-space:nowrap;font-size:14px;color:#EDBF6B;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;display:none}
#okaba-guide.ar-bottom .og-alab,#okaba-guide.ar-top .og-alab{display:block}
#okaba-guide.ar-bottom .og-alab{bottom:calc(84px + env(safe-area-inset-bottom))}
#okaba-guide.ar-top .og-alab{top:calc(80px + env(safe-area-inset-top))}
/* 窓の場所: 矢印が下＝窓は上寄り／矢印が上＝窓は下寄り／矢印なし＝まん中 */
#okaba-guide.ar-bottom .og-card{bottom:calc(100px + env(safe-area-inset-bottom))}
#okaba-guide.ar-top .og-card{top:calc(100px + env(safe-area-inset-top))}
#okaba-guide.ar-none .og-card{top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
/* 縦で高さが低い（iPhone SE など）: 題字の絵をやめて詰める */
@media (orientation: portrait) and (max-height: 700px){
 #okaba-guide .og-logo{display:none}
 #okaba-guide .og-card{padding:12px 14px 10px}
 #okaba-guide .og-lead{margin:5px 0 8px;font-size:14px}
 #okaba-guide .og-step{padding:8px 10px}
 #okaba-guide .og-notes{margin-top:7px;font-size:13px}
 #okaba-guide .og-btns{margin-top:9px}
 #okaba-guide button{min-height:44px}
}
@media (orientation: portrait) and (max-height: 580px){
 #okaba-guide .og-lead{display:none}
 #okaba-guide .og-txt{font-size:16.5px}
 #okaba-guide .og-notes li:first-child:not(:only-child){display:none}
}
/* 横画面（高さが低い）: 窓は左に寄せて、右の上を矢印にあける。窓の中は2列 */
@media (orientation: landscape) and (max-height: 520px){
 #okaba-guide .og-card{left:calc(16px + env(safe-area-inset-left));transform:none;top:auto;bottom:auto;
  width:calc(100vw - 32px - 100px - env(safe-area-inset-left) - env(safe-area-inset-right));max-width:680px;
  max-height:calc(100% - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:10px 14px 10px}
 #okaba-guide.ar-top .og-card,#okaba-guide.ar-bottom .og-card,#okaba-guide.ar-none .og-card{top:50%;bottom:auto;transform:translateY(-50%)}
 #okaba-guide.ar-none .og-card{left:50%;transform:translate(-50%,-50%);width:calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right))}
 #okaba-guide .og-logo{display:none}
 #okaba-guide .og-ttl{font-size:19px}
 #okaba-guide .og-ttl::after{margin-top:5px}
 #okaba-guide .og-lead{margin:4px 0 7px;font-size:14px}
 #okaba-guide .og-steps{grid-template-columns:1fr 1fr;gap:8px}
 #okaba-guide .og-step{padding:7px 9px;gap:9px}
 #okaba-guide .og-no{width:28px;height:28px;font-size:16px}
 #okaba-guide .og-txt{font-size:16px}
 #okaba-guide .og-txt small{font-size:13px}
 #okaba-guide .og-notes{margin-top:6px;font-size:13px}
 #okaba-guide .og-btns{margin-top:8px}
 #okaba-guide button{min-height:44px;padding:6px 12px}
 #okaba-guide .og-main{min-height:50px}
 #okaba-guide .og-copy{margin-top:6px}
 #okaba-guide.ar-top .og-alab{top:calc(78px + env(safe-area-inset-top))}
}
@media (orientation: landscape) and (max-height: 280px){
 #okaba-guide .og-notes{display:none}
}
@media (orientation: landscape) and (max-height: 330px){
 #okaba-guide .og-card{padding:8px 12px 8px}
 #okaba-guide .og-card::before,#okaba-guide .og-card::after{top:5px}
 #okaba-guide .og-ttl{font-size:17px}
 #okaba-guide .og-ttl::after{margin-top:3px}
 #okaba-guide .og-lead{display:none}
 #okaba-guide .og-steps{margin-top:6px;gap:6px}
 #okaba-guide .og-step{padding:5px 8px;gap:8px}
 #okaba-guide .og-no{width:26px;height:26px;font-size:15px}
 #okaba-guide .og-txt{font-size:15px;line-height:1.4}
 #okaba-guide .og-txt small{font-size:12.5px;line-height:1.35}
 #okaba-guide .og-ico{width:28px;height:28px;border-radius:7px}
 #okaba-guide .og-ico svg{width:20px;height:20px}
 #okaba-guide .og-chip{font-size:14px;padding:3px 8px}
 #okaba-guide .og-notes{margin-top:5px;font-size:12.5px;line-height:1.4}
 #okaba-guide .og-notes li:first-child:not(:only-child){display:none}
 #okaba-guide .og-btns{margin-top:6px}
 #okaba-guide button{min-height:42px;padding:4px 12px}
}
/* 2026-10-31: 記録カードの時の案内（3つの手順）。横では3列 */
#okaba-guide .og-aico{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:26px;height:26px;margin:0 2px;border-radius:6px;background:#F2E8D6;color:#0a6cff;box-shadow:0 1px 3px rgba(0,0,0,.8)}
#okaba-guide .og-aico svg{width:19px;height:19px}
#okaba-guide .og-ttl small{display:block;font-size:15px;color:#BDB3A3;letter-spacing:.02em;margin-top:2px}
@media (orientation: landscape) and (max-height: 520px){
 #okaba-guide.og-3 .og-steps{grid-template-columns:1fr 1fr 1fr}
 #okaba-guide.og-3 .og-step{flex-direction:column;align-items:flex-start;gap:5px}
 #okaba-guide.og-3 .og-txt{font-size:17px}
}
/* アプリの中のブラウザ: 上の小さな帯（幕なし。どちらでも遊べる） */
#okaba-bar{position:fixed;z-index:41;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);box-sizing:border-box;
 width:min(600px,calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));display:none;align-items:center;gap:12px;
 padding:10px 12px 10px 14px;border-radius:4px;background:rgba(16,13,12,.95);border:1px solid #5e5245;
 box-shadow:inset 0 0 0 3px #100d0c,inset 0 0 0 4px rgba(242,232,214,.20),0 6px 24px rgba(0,0,0,.7);
 color:#F2E8D6;-webkit-text-size-adjust:100%;text-size-adjust:100%;
 font:700 16px/1.45 "OkabaGuide",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;animation:ogIn .18s ease-out both}
#okaba-bar.on{display:flex}
#okaba-bar .ob-txt{flex:1;min-width:0}
#okaba-bar .ob-txt b{color:#EDBF6B}
#okaba-bar .ob-txt small{display:block;font-size:14px;line-height:1.4;color:#BDB3A3;margin-top:2px}
#okaba-bar .ob-btns{flex:none;display:flex;flex-direction:column;align-items:stretch;gap:4px}
#okaba-bar button{font:inherit;cursor:pointer;touch-action:manipulation;border-radius:3px;transition:transform .07s ease-out}
#okaba-bar button:active{transform:scale(.94)}
#okaba-bar .ob-play{min-height:50px;padding:6px 18px;font-size:18px;color:#F2E8D6;background:linear-gradient(180deg,#b8402a,#8e2a1a);border:1px solid #D65238;
 box-shadow:inset 0 0 0 2px #8e2a1a,inset 0 0 0 3px rgba(242,232,214,.35)}
#okaba-bar .ob-copy{min-height:34px;padding:2px 8px;font-size:13.5px;color:#BDB3A3;background:transparent;border:0;text-decoration:underline;text-underline-offset:3px}
#okaba-bar .ob-msg{display:block;color:#EDBF6B;font-size:13.5px;margin-top:2px}
#okaba-bar .ob-msg:empty{display:none}
@media (orientation: portrait){
 #okaba-bar{flex-wrap:wrap}
 #okaba-bar .ob-btns{flex:1 1 100%;flex-direction:row}
 #okaba-bar .ob-play{flex:1}
}
/* 記録カードの時に縦だったら: 先に「横にしてね」（さわれない帯。カードのボタンはそのまま押せる） */
#okaba-rot{position:fixed;z-index:39;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);display:none;pointer-events:none;
 box-sizing:border-box;width:min(420px,calc(100vw - 32px));padding:12px 16px;border-radius:4px;text-align:center;background:rgba(16,13,12,.94);border:1px solid #5e5245;
 color:#F2E8D6;font:700 20px/1.45 "OkabaGuide",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
#okaba-rot.on{display:block;animation:ogIn .18s ease-out both}
#okaba-rot small{display:block;font-size:15px;color:#BDB3A3;margin-top:2px}
#okaba-rot svg{width:40px;height:40px;display:block;margin:0 auto 4px;color:#EDBF6B}
/* 前の左下の案内（patch_web.py）は使わない */
#okaba-a2hs{display:none!important}
</style>
